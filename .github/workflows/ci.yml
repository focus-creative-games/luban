name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Luban.sln

      - name: Build
        run: dotnet build src/Luban.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/Luban.Tests/Luban.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
